<svg xmlns="http://www.w3.org/2000/svg"
        width="1024" height="1024" viewBox="0 0 1024 1024">
        
<defs>
  <linearGradient id="gold" gradientUnits="userSpaceOnUse"
                  x1="180" y1="120" x2="820" y2="700">
    <stop offset="0%" stop-color="#FFE16A"/>
    <stop offset="42%" stop-color="#FFD000"/>
    <stop offset="100%" stop-color="#F2AD00"/>
  </linearGradient>
  <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
