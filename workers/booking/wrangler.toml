name = "fluxidi-booking-api"
main = "fluxidi_booking_worker.js"
compatibility_date = "2026-04-23"

# Bundle from entrypoint only; avoid auto-attaching local text/binary snapshots.
find_additional_modules = false

[vars]
GOOGLE_CALENDAR_ID = "primary"
FLEET_AVAILABILITY_MODE = "multi_vehicle"
COMPLIANCE_API_URL = "https://fluxidi-compliance-api.fluxidi.workers.dev"
# RELEASE-P0 Option A′ — staged rollout. Keep "0" until month seed is verified.
HUMAN_BOOKING_ID_DO_ALLOCATOR = "1"
# TRUSTED-IDENTITY-P0 — allocator mutation/probe routes disabled by default.
# Set temporarily to "1" for ops proofs only; leave "0" in production.
HUMAN_BOOKING_ID_PROBES_ENABLED = "0"
# TRUSTED-IDENTITY-P0 — contact-proof-only customer read/cancel. Disabled by
# default; enable only for a measured migration window.
ALLOW_LEGACY_CUSTOMER_CONTACT_PROOF = "0"
# RELEASE-P1 — list/dispatch use strict ownership. Kept as documentation flag;
# behavior is always-on in code paths (no soft fallback).
STRICT_LIST_DISPATCH_OWNERSHIP = "1"
# RELEASE-P1 — admin legacy scope migrate/quarantine apply. Dry-run always
# allowed for admin; apply requires this flag = "1".
LEGACY_SCOPE_MIGRATION_ENABLED = "0"
# GOOGLE-PLAY-REVIEW-ACCESS-P0 — non-secret company allowlist. The reusable
# credential hash MUST be set via: wrangler secret put PLAY_REVIEW_ACCESS_CODE_HASH
# Worker hard-gates FLX-00020 and fails closed if this var disagrees.
PLAY_REVIEW_COMPANY_CODE = "FLX-00020"
# KV-CRON-AMPLIFIERS-P0 — keep "0" until counting tests pass and Christophe
# approves a re-enable. Live 2026-08-29: */2 cron burned ~3,280 reads/tick.
BILLIT_RECOVERY_CRON_ENABLED = "0"
INVOICE_LOGO_REPAIR_CRON_ENABLED = "0"
BOOKING_KV_HOURLY_READ_BUDGET = "2000"
BOOKING_KV_DAILY_READ_BUDGET = "20000"

# Mollie Connect OAuth (Phase 1) — set via Cloudflare secrets, never commit values:
# MOLLIE_CONNECT_CLIENT_ID       — OAuth app client id (app_…)
# MOLLIE_CONNECT_CLIENT_SECRET   — OAuth app client secret
# MOLLIE_CONNECT_STATE_SECRET    — HMAC secret for signed OAuth state
# MOLLIE_CONNECT_ENCRYPTION_KEY  — AES-GCM encryption key for stored tokens
# MOLLIE_CONNECT_ENCRYPTION_KID — optional key id label (default v1)
#
# Fluxidi-owned subscription billing (Patch 2.1) — set via Cloudflare secrets,
# never commit values. INTENTIONALLY SEPARATE from MOLLIE_CONNECT_*. The
# subscription path must never read MOLLIE_CONNECT_* and ride payments must
# never read FLUXIDI_SUBSCRIPTION_*:
# FLUXIDI_SUBSCRIPTION_MOLLIE_API_KEY   — Fluxidi-owned Mollie API key (test_… or live_…)
# FLUXIDI_SUBSCRIPTION_WEBHOOK_SECRET   — path-secret used in /webhooks/subscription/mollie/{secret}
# FLUXIDI_SUBSCRIPTION_MOLLIE_MODE      — required for add-on checkout/activation.
#   Must be "test" or "live" and MUST match the API key prefix. Mismatch fails closed.
# FLUXIDI_SUBSCRIPTION_ADDON_TEST_COMPANY_ALLOWLIST — public company codes and/or
#   company IDs allowed to receive test-mode add-on entitlements. Empty = deny all.
#   Do not infer test permission from display names.
FLUXIDI_SUBSCRIPTION_ADDON_TEST_COMPANY_ALLOWLIST = ""
#
# RateHawk credentials, host allowlist, Hotelpage transport and offer
# references live on the Hotels Workers. This Booking Worker must not hold
# RATEHAWK_API_KEY / RATEHAWK_KEY_ID / RATEHAWK_OFFER_REF_SECRET.
# RATEHAWK_VIEW_STAY_CONTEXT_SECRET — production HMAC only
#   (wrangler secret put; never commit). Public Hotelpage uses this.
# RATEHAWK_TEST_VIEW_STAY_CONTEXT_SECRET — admin test HMAC only
#   (wrangler secret put; never commit). Must match the test Hotels Worker
#   RATEHAWK_VIEW_STAY_CONTEXT_SECRET. Do not reuse the production secret.
# Isolated admin test-search / test-Hotelpage / test-prebook.
# Public RateHawk stays blocked. Do not flip test-prebook until a
# dedicated gates-off deploy is explicitly requested.
RATEHAWK_TEST_SEARCH_ENABLED = "1"
RATEHAWK_TEST_HOTELPAGE_ENABLED = "1"
RATEHAWK_TEST_PREBOOK_ENABLED = "0"
RATEHAWK_BOOKING_FORM_ENABLED = "0"
RATEHAWK_BOOKING_FINISH_ENABLED = "0"
RATEHAWK_BOOKING_STATUS_ENABLED = "0"
# Deploy order after the test Worker exists:
#   1) fluxidi-ratehawk-hotels-api
#   2) fluxidi-ratehawk-hotels-api-test
#   3) fluxidi-booking-api --keep-vars

# Internal company-session Billit sandbox OAuth (fail-closed). Requires BOTH
# the master flag and an explicit company_id allowlist. Ordinary customers
# stay blocked. Admin /admin/integrations/billit/oauth/start is independent.
BILLIT_ALLOW_COMPANY_SANDBOX_OAUTH = "1"
BILLIT_SANDBOX_OAUTH_COMPANY_ALLOWLIST = "fluxidi_fluxidi_ddmh9g"

[[services]]
binding = "COMPLIANCE_WORKER"
service = "fluxidi-compliance-api"

[[services]]
binding = "RATEHAWK_HOTELS"
service = "fluxidi-ratehawk-hotels-api"

[[services]]
binding = "RATEHAWK_HOTELS_TEST"
service = "fluxidi-ratehawk-hotels-api-test"

[observability.logs]
enabled = true

# KV-CRON-AMPLIFIERS-P0: cron paused after 2026-08-29 cost forensics.
# Do not restore */2 until counting tests prove idle tick ≤3 reads / 1 list / 0 writes.
[triggers]
crons = []

[[durable_objects.bindings]]
name = "FLEET_ALLOCATOR"
class_name = "FleetAllocatorDO"

[[durable_objects.bindings]]
name = "BOOKING_REFERENCE_SEQUENCE"
class_name = "BookingReferenceSequenceDO"

[[durable_objects.bindings]]
name = "DOCUMENT_REFERENCE_SEQUENCE"
class_name = "DocumentReferenceSequenceDO"

[[durable_objects.bindings]]
name = "FLUXIDI_SUBSCRIPTION_FOUNDER_SLOTS"
class_name = "FluxidiSubscriptionFounderSlotsDO"

[[durable_objects.bindings]]
name = "HUMAN_BOOKING_ID_SEQUENCE"
class_name = "HumanBookingIdSequenceDO"

# REQUIRED KV bindings used by this worker code.
[[kv_namespaces]]
binding = "BOOKING_KV"
id = "6805da1ffefe4a3982b4c419250c59b1"

[[kv_namespaces]]
binding = "FLUXIDI_TRACKING"
id = "e457c0f51cfe44bca031250a0485b31e"

[[kv_namespaces]]
binding = "INVOICE_KV"
id = "c945929b64a743fdb10e09059d835746"

[[r2_buckets]]
binding = "PUBLIC_MEDIA"
bucket_name = "fluxidi-public-media"

[[migrations]]
tag = "fleet-allocator-v1"
new_sqlite_classes = ["FleetAllocatorDO"]

[[migrations]]
tag = "booking-reference-sequence-v1"
new_sqlite_classes = ["BookingReferenceSequenceDO"]

[[migrations]]
tag = "document-reference-sequence-v1"
new_sqlite_classes = ["DocumentReferenceSequenceDO"]

[[migrations]]
tag = "fluxidi-subscription-founder-slots-v1"
new_sqlite_classes = ["FluxidiSubscriptionFounderSlotsDO"]

[[migrations]]
tag = "human-booking-id-sequence-v1"
new_sqlite_classes = ["HumanBookingIdSequenceDO"]
