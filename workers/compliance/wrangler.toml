name = "fluxidi-compliance-api"
main = "fluxidi_compliance_worker.js"
compatibility_date = "2026-04-30"
workers_dev = true
preview_urls = false

[observability.logs]
enabled = true

# KV-CRON-AMPLIFIERS-P0: cron paused after 2026-08-29 cost forensics.
# Do not restore */5 until a 1,400-event reconcile stays ≤50 KV reads.
[triggers]
crons = []

# RELEASE-P0-CHIRON-TEST-RUNTIME-GATE-2026-07-31: non-sensitive test-runtime
# configuration for the official Chiron ACC path. These are the ONLY two
# environment values required at deploy time to unlock the operator-driven
# testflow submit-one endpoint. All bearer credentials (per-company OAuth
# client_id/client_secret) live in KV and are decrypted with the
# `CHIRON_CREDENTIALS_ENCRYPTION_KEY` secret at request time — they are never
# committed here and never derived from `CHIRON_EXPORT_API_TOKEN`.
#
# Only ACC (mow-acc.api.vlaanderen.be) taxirit URLs must be committed. No
# production URL. No fallback URL. No credentials.
[vars]
CHIRON_EXPORT_MODE = "test"
CHIRON_EXPORT_BASE_URL = "https://mow-acc.api.vlaanderen.be/chiron/taxirit"
# KV-CRON-AMPLIFIERS-P0 — keep "0" until counting tests pass.
CHIRON_CRON_ENABLED = "0"
CHIRON_STATUS_POLL_RECONCILE_ENABLED = "0"
COMPLIANCE_KV_HOURLY_READ_BUDGET = "800"
COMPLIANCE_KV_DAILY_READ_BUDGET = "8000"

# CHIRON-OFFLINE-ARRIVAL-P0: intentionally NOT set. CH1303 is an *update*
# conflict ("Vertrektijdstip kreeg een nieuwe waarde"), not an already-exists
# acknowledgement, so it may never imply acceptance. The duplicate-confirmation
# path stays fail-closed until a narrowly proven code exists.
# CHIRON_DUPLICATE_VERTREK_FOUTCODES = ""

# Append-only compliance event storage.
[[kv_namespaces]]
binding = "COMPLIANCE_KV"
id = "04313c4521454b909293208d738471a1"

# Chiron-6B-2: read-only scoped business/fleet/driver profile hydration (same namespace as booking worker).
[[kv_namespaces]]
binding = "BOOKING_KV"
id = "6805da1ffefe4a3982b4c419250c59b1"

# Optional auth token (set as a secret in non-dev environments):
#   wrangler secret put COMPLIANCE_ADMIN_TOKEN
# or:
#   wrangler secret put ADMIN_TOKEN

# Chiron credentials (Phase 2) — set via Cloudflare secrets, never commit values:
# CHIRON_CREDENTIALS_ENCRYPTION_KEY    — AES-GCM encryption key for stored Chiron credentials
# CHIRON_CREDENTIALS_ENCRYPTION_KID    — optional key id label (default v1)
# CHIRON_PRODUCTION_SUBMIT_ENABLED     — explicit gate for production credential/submit paths
#
# DEPRECATED legacy secret (kept only so pre-existing deployments do not break;
# no code path uses this value as an HTTP bearer any more — the official
# taxirit-POST uses the per-company OAuth-derived access token exclusively):
# CHIRON_EXPORT_API_TOKEN              — legacy static token, DO NOT rely on
