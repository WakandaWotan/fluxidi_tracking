name = "fluxidi-ratehawk-hotels-api"
main = "fluxidi_ratehawk_hotels_worker.js"
compatibility_date = "2026-04-30"
workers_dev = false
preview_urls = false
find_additional_modules = false

# Private Service Binding worker. No public customer route.
# Future deployment order:
#   1. fluxidi-ratehawk-hotels-api
#   2. fluxidi-booking-api (contains [[services]] RATEHAWK_HOTELS)

[observability.logs]
enabled = true

[vars]
# RateHawk / ETG hotel provider — secrets via `wrangler secret put`, never commit.
# RATEHAWK_KEY_ID
# RATEHAWK_API_KEY
# RATEHAWK_BASE_URL
# RATEHAWK_ENVIRONMENT          — sandbox | test | production
# RATEHAWK_PRODUCTION_ENABLED   — extra production gate (P3)
# RATEHAWK_OFFER_REF_SECRET     — mandatory AES-GCM offer-reference secret
# RATEHAWK_VIEW_STAY_CONTEXT_SECRET — HMAC for server-issued View stay context
RATEHAWK_ENABLED = "0"
RATEHAWK_HOTELPAGE_ENABLED = "0"
RATEHAWK_CONTENT_SYNC_ENABLED = "0"
RATEHAWK_CONTENT_BATCH_ENABLED = "0"
# Production quotas must be set explicitly or Hotelpage/SERP/content fail closed:
# RATEHAWK_QUOTA_HOTELPAGE_LIMIT
# RATEHAWK_QUOTA_HOTELPAGE_WINDOW_SECONDS
# RATEHAWK_QUOTA_SERP_LIMIT
# RATEHAWK_QUOTA_SERP_WINDOW_SECONDS
# RATEHAWK_QUOTA_HOTEL_CONTENT_LIMIT
# RATEHAWK_QUOTA_HOTEL_CONTENT_WINDOW_SECONDS
# RATEHAWK_CONTENT_MARKETS — JSON array; empty until explicitly supplied
# Future: [triggers] crons — do not enable until markets and the sync gate
# are explicit. scheduled() is wired but no cron is configured.

# Future storage (not created in this task):
# [[d1_databases]] binding = "RATEHAWK_HOTELS_DB"  — searchable hid index
# [[kv_namespaces]] binding = "RATEHAWK_CONTENT_KV" — localized policy documents
# [[queues]] — optional later batch consumer
# Deploy/migration order after those exist:
#   1. create D1/KV/Queue
#   2. fluxidi-ratehawk-hotels-api (this worker + quota DO migration)
#   3. fluxidi-booking-api

[[durable_objects.bindings]]
name = "RATEHAWK_PROVIDER_QUOTA"
class_name = "RatehawkProviderQuotaDO"

[[migrations]]
tag = "ratehawk-provider-quota-v1"
new_sqlite_classes = ["RatehawkProviderQuotaDO"]
