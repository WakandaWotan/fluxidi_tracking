name = "fluxidi-ratehawk-hotels-api"
main = "fluxidi_ratehawk_hotels_worker.js"
compatibility_date = "2026-04-30"
workers_dev = false
preview_urls = false
find_additional_modules = false

# Private Service Binding worker. No public customer route.
# Future deployment order:
#   1. fluxidi-ratehawk-hotels-api
#   2. fluxidi-booking-api (contains [[services]] RATEHAWK_HOTELS)

[observability.logs]
enabled = true

[vars]
# Production security domain. Do not put RateHawk test credentials, the test
# host, or RATEHAWK_ENVIRONMENT=test on this Worker.
# Secrets via `wrangler secret put` on this Worker only, never commit:
# RATEHAWK_KEY_ID
# RATEHAWK_API_KEY
# RATEHAWK_OFFER_REF_SECRET
# RATEHAWK_VIEW_STAY_CONTEXT_SECRET
# RATEHAWK_BASE_URL / RATEHAWK_ENVIRONMENT stay unset here until production.
# RATEHAWK_PRODUCTION_ENABLED   — extra production gate (P3)
RATEHAWK_WORKER_SURFACE = "production"
RATEHAWK_ENABLED = "0"
RATEHAWK_HOTELPAGE_ENABLED = "0"
RATEHAWK_CONTENT_SYNC_ENABLED = "0"
RATEHAWK_CONTENT_BATCH_ENABLED = "0"
RATEHAWK_TEST_SEARCH_ENABLED = "0"
RATEHAWK_TEST_HOTELPAGE_ENABLED = "0"
# Production quotas must be set explicitly or Hotelpage/SERP/content fail closed:
# RATEHAWK_QUOTA_HOTELPAGE_LIMIT
# RATEHAWK_QUOTA_HOTELPAGE_WINDOW_SECONDS
# RATEHAWK_QUOTA_SERP_LIMIT
# RATEHAWK_QUOTA_SERP_WINDOW_SECONDS
# RATEHAWK_QUOTA_HOTEL_CONTENT_LIMIT
# RATEHAWK_QUOTA_HOTEL_CONTENT_WINDOW_SECONDS
# RATEHAWK_CONTENT_MARKETS — JSON array; empty until explicitly supplied
# Future: [triggers] crons — do not enable until markets and the sync gate
# are explicit. scheduled() is wired but no cron is configured.

[[d1_databases]]
binding = "RATEHAWK_HOTELS_DB"
database_name = "fluxidi-ratehawk-hotels-db"
database_id = "64bd3865-419f-47cd-91db-cd20329614c5"
migrations_dir = "migrations"

# RATEHAWK_CONTENT_KV is not used. Market caps stay small enough that one D1
# can atomically coordinate identity, locale content and sync revisions.
# Split/KV storage may be introduced later only from measured evidence.
# [[queues]] — optional later batch consumer
# Deploy order after this D1 exists:
#   1. apply D1 migrations
#   2. fluxidi-ratehawk-hotels-api (this worker + quota DO migration)
#   3. fluxidi-booking-api

[[durable_objects.bindings]]
name = "RATEHAWK_PROVIDER_QUOTA"
class_name = "RatehawkProviderQuotaDO"

[[migrations]]
tag = "ratehawk-provider-quota-v1"
new_sqlite_classes = ["RatehawkProviderQuotaDO"]

# Isolated test security domain. Bindings/vars/secrets do not inherit.
# Deploy later only with: npx wrangler deploy --env test
# That first deploy would create fluxidi-ratehawk-hotels-api-test and a
# separate RatehawkProviderQuotaDO namespace. Do not share script_name
# with production. No D1, cron, route, workers.dev or preview URL.
[env.test]
name = "fluxidi-ratehawk-hotels-api-test"
main = "fluxidi_ratehawk_hotels_worker.js"
compatibility_date = "2026-04-30"
workers_dev = false
preview_urls = false
find_additional_modules = false

[env.test.observability.logs]
enabled = true

[env.test.vars]
# Future secrets (wrangler secret put --env test), never commit:
# RATEHAWK_KEY_ID
# RATEHAWK_API_KEY
# RATEHAWK_OFFER_REF_SECRET
# RATEHAWK_VIEW_STAY_CONTEXT_SECRET
RATEHAWK_WORKER_SURFACE = "test"
RATEHAWK_ENVIRONMENT = "test"
RATEHAWK_BASE_URL = "https://api.ratehawk.com"
RATEHAWK_ENABLED = "0"
RATEHAWK_HOTELPAGE_ENABLED = "0"
RATEHAWK_CONTENT_SYNC_ENABLED = "0"
RATEHAWK_CONTENT_BATCH_ENABLED = "0"
RATEHAWK_TEST_SEARCH_ENABLED = "0"
RATEHAWK_TEST_HOTELPAGE_ENABLED = "0"

[[env.test.durable_objects.bindings]]
name = "RATEHAWK_PROVIDER_QUOTA"
class_name = "RatehawkProviderQuotaDO"

[[env.test.migrations]]
tag = "ratehawk-provider-quota-test-v1"
new_sqlite_classes = ["RatehawkProviderQuotaDO"]
